name: Publish FIRULET MAP preview downloads
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firulet-map-preview-downloads
  cancel-in-progress: false
jobs:
  upload-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified immutable preview files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          script: |
            set -eu
            cd /var/www/portfolio
            git pull --ff-only
            sudo bash tooling/scripts/install-firulet-preview-20261029.sh
            sudo bash tooling/scripts/install-firulet-preview-20261029.sh --verify-only
